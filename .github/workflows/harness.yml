name: Harness Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run content validation harness
        run: node scripts/validate-harness.mjs

      - name: Run automated regression & stage-gate tests
        run: node scripts/test-regression.mjs
